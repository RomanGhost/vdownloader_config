services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (guest/guest)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: ./vdownloader_worker
    command: ["./downloader", "-worker"]
    env_file: ./vdownloader_worker/.env
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - OUT_DIR=/downloads
      - FILE_SERVER_ADDR=:8080
    ports:
      - "8080:8080"
    volumes:
      - downloads:/downloads
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  telegram:
    build: ./vdownloader_telegram
    env_file: ./vdownloader_telegram/.env
    environment:
      - WORKER_URL=http://worker:8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./vdownloader_web
    environment:
      - WORKER_URL=http://worker:8080
      - HTTP_ADDR=:8082
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

volumes:
  downloads:
  rabbitmq_data:
